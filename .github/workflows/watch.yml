name: kfsi-seat-watcher

on:
  schedule:
    - cron: "2-59/5 * * * *"   # 정각 혼잡 회피. GitHub 사정으로 늦어지거나 건너뛸 수 있어 외부 크론(workflow_dispatch)으로도 깨운다
  workflow_dispatch:
    inputs:
      simulate_open:
        description: "결원 발생을 가정하고 [테스트] 알림만 보내기 (감시 상태는 건드리지 않음)"
        type: boolean
        default: false

permissions:
  contents: read             # GITHUB_TOKEN 은 읽기 전용

concurrency:
  group: kfsi-seat-watcher   # 실행이 겹쳐 중복 알림이 가지 않도록

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Seoul          # deadline / 로그 시각을 한국 시간으로
    steps:
      - uses: actions/checkout@v4

      # 직전 실행의 state.json(알림 상태)만 이어받는다. 토큰은 캐시에 두지 않는다
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: watcher-state-${{ github.run_id }}
          restore-keys: watcher-state-

      - name: Check vacancy
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          KAKAO_TOKEN_JSON: ${{ secrets.KAKAO_TOKEN_JSON }}
          SIMULATE_OPEN: ${{ inputs.simulate_open }}   # schedule / cron-job.org 호출에서는 비어 있거나 false
        run: |
          printf '%s' "$CONFIG_JSON" > config.json
          printf '%s' "$KAKAO_TOKEN_JSON" > "$RUNNER_TEMP/kakao_token.json"
          if [ "$SIMULATE_OPEN" = "true" ]; then
            python3 watcher.py --simulate-open --token-file "$RUNNER_TEMP/kakao_token.json"
          else
            python3 watcher.py --cron --state-dir state --token-file "$RUNNER_TEMP/kakao_token.json"
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: watcher-state-${{ github.run_id }}

name: kfsi-seat-watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub 사정에 따라 실제 실행은 늦어질 수 있음
  workflow_dispatch:

concurrency:
  group: kfsi-seat-watcher   # 실행이 겹쳐 중복 알림이 가지 않도록

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Seoul          # deadline / 로그 시각을 한국 시간으로
    steps:
      - uses: actions/checkout@v4

      # 직전 실행의 state.json / 갱신된 카카오 토큰을 이어받는다
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: watcher-state-${{ github.run_id }}
          restore-keys: watcher-state-

      - name: Check vacancy
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          KAKAO_TOKEN_JSON: ${{ secrets.KAKAO_TOKEN_JSON }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json
          mkdir -p state
          [ -f state/kakao_token.json ] || printf '%s' "$KAKAO_TOKEN_JSON" > state/kakao_token.json
          python3 watcher.py --cron --state-dir state

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: watcher-state-${{ github.run_id }}
